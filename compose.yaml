name: coursegraph

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-coursegraph-dev}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-coursegraph-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  seed:
    build: .
    environment: &app-environment
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-coursegraph-dev}
      COURSEGRAPH_BACKEND: neo4j
    command: ["python", "-m", "coursegraph.seed"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *app-environment
    command: ["uvicorn", "coursegraph.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    build: .
    environment:
      COURSEGRAPH_API_URL: http://api:8000
    command: ["streamlit", "run", "src/coursegraph/ui.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:

